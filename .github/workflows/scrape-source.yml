name: Scrape source

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source:
        description: Source to scrape
        required: true
        type: choice
        options:
          - all
          - ashby
          - greenhouse
          - lever
          - smartrecruiters
          - workable
          - pinpoint
          - gem
          - workday
          - simplify
          - zshah101
          - aprameyak

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run listings "$SOURCE"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data site
          git diff --cached --quiet || git commit -m "Scrape $SOURCE"
          git pull --rebase origin main
          git push

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/app.js _site/app.js
          cp data/listings.csv _site/listings.csv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
