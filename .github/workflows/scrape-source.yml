name: Scrape source

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source:
        description: Source to scrape
        required: true
        type: choice
        options:
          - all
          - ashby
          - greenhouse
          - lever
          - smartrecruiters
          - workable
          - pinpoint
          - gem
          - workday
          - simplify
          - zshah101
          - aprameyak

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run listings "$SOURCE"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data
          git diff --cached --quiet || git commit -m "Scrape $SOURCE"
          git pull --rebase origin main
          git push
