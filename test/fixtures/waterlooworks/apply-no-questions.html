<html lang="en">
<head><title>WaterlooWorks - Apply</title></head>
<body class="orbis">
<div id="mainContentDiv">
  <form id="applicationForm" name="applicationForm" action="/myAccount/co-op/applications.htm" method="post">
    <h2 class="heading--banner">Apply to Backend Developer (Payments)</h2>
    <input type="hidden" name="postingId" value="384930">

    <div class="panel panel-default">
      <div class="panel-heading"><h3>Application Package</h3></div>
      <div class="panel-body">
        <div class="form-group">
          <label for="package-select">Choose an existing application package</label>
          <select id="package-select" name="applicationPackageId">
            <option value="">Select a package</option>
            <option value="1201">Software - Fall 2026</option>
            <option value="1202" selected>Infrastructure - Fall 2026</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel panel-default">
      <div class="panel-heading"><h3>Documents</h3></div>
      <div class="panel-body">
        <table class="table table-bordered">
          <tbody>
            <tr>
              <th scope="row"><label for="doc-resume">R&eacute;sum&eacute; (required)</label></th>
              <td>
                <select id="doc-resume" name="documentResumeId" required>
                  <option value="">Select a document</option>
                  <option value="9001" selected>Resume - B Zhou.pdf</option>
                </select>
              </td>
            </tr>
            <tr>
              <th scope="row"><label for="doc-grades">Grade Report</label></th>
              <td>
                <select id="doc-grades" name="documentGradeReportId">
                  <option value="">Select a document</option>
                  <option value="9201">Grade Report.pdf</option>
                </select>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" name="submitApplication">Submit Application</button>
    </div>
  </form>
</div>
</body>
</html>
