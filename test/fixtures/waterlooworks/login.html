<html lang="en">
<head><title>Sign in to WaterlooWorks</title></head>
<body class="cas">
<div id="loginArea">
  <h1>Central Authentication Service</h1>
  <p>Sign in with your WatIAM user name and password to continue to WaterlooWorks.</p>
  <form id="loginForm" action="/login" method="post">
    <div class="form-group">
      <label for="userNameInput">User name</label>
      <input type="text" id="userNameInput" name="userName" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" name="password" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</div>
</body>
</html>
