<html lang="en">
<head><title>WaterlooWorks - Apply</title></head>
<body class="orbis">
<div id="mainContentDiv">
  <form id="applicationForm" name="applicationForm" action="/myAccount/co-op/applications.htm" method="post">
    <h2 class="heading--banner">Apply to Software Engineer Intern</h2>
    <input type="hidden" name="postingId" value="384922">

    <div class="panel panel-default">
      <div class="panel-heading"><h3>Select an existing application package</h3></div>
      <div class="panel-body">
        <table class="table table-bordered">
          <thead>
            <tr><th scope="col"></th><th scope="col">Package Name</th><th scope="col">Documents</th></tr>
          </thead>
          <tbody>
            <tr>
              <td><input type="radio" id="package-1201" name="applicationPackageId" value="1201" checked></td>
              <td><label for="package-1201">Software - Fall 2026</label></td>
              <td>Resume - B Zhou.pdf; Cover Letter - Datadog.pdf; Grade Report.pdf</td>
            </tr>
            <tr>
              <td><input type="radio" id="package-1202" name="applicationPackageId" value="1202"></td>
              <td><label for="package-1202">Infrastructure - Fall 2026</label></td>
              <td>Resume - Infra.pdf; Grade Report.pdf</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel panel-default">
      <div class="panel-heading"><h3>Or create a new application package</h3></div>
      <div class="panel-body">
        <table class="table table-bordered">
          <tbody>
            <tr>
              <th scope="row"><label for="doc-resume">R&eacute;sum&eacute; (required)</label></th>
              <td>
                <select id="doc-resume" name="documentResumeId" required>
                  <option value="">Select a document</option>
                  <option value="9001">Resume - B Zhou.pdf</option>
                  <option value="9002">Resume - Infra.pdf</option>
                </select>
              </td>
            </tr>
            <tr>
              <th scope="row"><label for="doc-cover">Cover Letter</label></th>
              <td>
                <select id="doc-cover" name="documentCoverLetterId">
                  <option value="">Select a document</option>
                  <option value="9101">Cover Letter - Datadog.pdf</option>
                </select>
              </td>
            </tr>
            <tr>
              <th scope="row"><label for="doc-grades">Grade Report</label></th>
              <td>
                <select id="doc-grades" name="documentGradeReportId">
                  <option value="">Select a document</option>
                  <option value="9201">Grade Report.pdf</option>
                </select>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel panel-default">
      <div class="panel-heading"><h3>Employer pre-screening questions</h3></div>
      <div class="panel-body">
        <div class="form-group question" data-question-id="q1">
          <label for="q1-answer">Are you legally eligible to work in the United States for the entire work term?</label>
          <select id="q1-answer" name="answer_q1" required>
            <option value="">Choose one</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
        <div class="form-group question" data-question-id="q2">
          <label for="q2-answer">Describe a system you have built and what you would change about it.</label>
          <textarea id="q2-answer" name="answer_q2" rows="4"></textarea>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" name="submitApplication">Submit Application</button>
    </div>
  </form>
</div>
</body>
</html>
